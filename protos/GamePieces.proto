#VRML_SIM R2025a utf8
# GamePieces.proto - the six movable game pieces of Section 3 (blue cylinders: dia 5 cm x 5 cm, green cubes: 5 cm)
#   * collection points : 1 blue cylinder + 1 green cube (on their pads, 35 cm either side of the centre line)
#   * Nine-Point Board  : Cylinder 1 @ pos 3, Cylinder 2 @ pos 5, Cube 1 @ pos 2, Cube 2 @ pos 4 (rulebook Figure 1/8)
# Pieces are dynamic (30 g) so a gripper can pick them up. Delete a 'physics' node to make a piece static.
# cylinderRotation stands the Cylinder primitive upright (rotating 90 deg around X).
PROTO GamePieces [
  field SFRotation cylinderRotation 0 0 0 1.5708
] {
  Group {
    children [
    Solid {
      translation 2 2.7 0.025
      children [
        Shape {
          appearance PBRAppearance {
            baseColor 0.1 0.8 0.1
            roughness 0.6
            metalness 0
          }
          geometry Box {
            size 0.05 0.05 0.05
          }
        }
      ]
      name "collect_green_cube"
      boundingObject Box {
        size 0.05 0.05 0.05
      }
      physics Physics {
        density -1
        mass 0.03
      }
    }
    Solid {
      translation 2 3.4 0.025
      children [
        Transform {
          rotation IS cylinderRotation
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.15 0.3 1
                roughness 0.6
                metalness 0
              }
              geometry Cylinder {
                height 0.05
                radius 0.025
              }
            }
          ]
        }
      ]
      name "collect_blue_cylinder"
      boundingObject Transform {
        rotation IS cylinderRotation
        children [
          Cylinder {
            height 0.05
            radius 0.025
          }
        ]
      }
      physics Physics {
        density -1
        mass 0.03
      }
    }
    Solid {
      translation 0.7 2.75 0.025
      children [
        Shape {
          appearance PBRAppearance {
            baseColor 0.1 0.8 0.1
            roughness 0.6
            metalness 0
          }
          geometry Box {
            size 0.05 0.05 0.05
          }
        }
      ]
      name "board_cube_1_pos2"
      boundingObject Box {
        size 0.05 0.05 0.05
      }
      physics Physics {
        density -1
        mass 0.03
      }
    }
    Solid {
      translation 0.7 3.35 0.025
      children [
        Shape {
          appearance PBRAppearance {
            baseColor 0.1 0.8 0.1
            roughness 0.6
            metalness 0
          }
          geometry Box {
            size 0.05 0.05 0.05
          }
        }
      ]
      name "board_cube_2_pos4"
      boundingObject Box {
        size 0.05 0.05 0.05
      }
      physics Physics {
        density -1
        mass 0.03
      }
    }
    Solid {
      translation 1.1 3.35 0.025
      children [
        Transform {
          rotation IS cylinderRotation
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.15 0.3 1
                roughness 0.6
                metalness 0
              }
              geometry Cylinder {
                height 0.05
                radius 0.025
              }
            }
          ]
        }
      ]
      name "board_cylinder_1_pos3"
      boundingObject Transform {
        rotation IS cylinderRotation
        children [
          Cylinder {
            height 0.05
            radius 0.025
          }
        ]
      }
      physics Physics {
        density -1
        mass 0.03
      }
    }
    Solid {
      translation 1.1 3.05 0.025
      children [
        Transform {
          rotation IS cylinderRotation
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.15 0.3 1
                roughness 0.6
                metalness 0
              }
              geometry Cylinder {
                height 0.05
                radius 0.025
              }
            }
          ]
        }
      ]
      name "board_cylinder_2_pos5"
      boundingObject Transform {
        rotation IS cylinderRotation
        children [
          Cylinder {
            height 0.05
            radius 0.025
          }
        ]
      }
      physics Physics {
        density -1
        mass 0.03
      }
    }
    ]
  }
}
